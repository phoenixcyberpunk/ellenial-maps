<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ellenial maps</title>
<meta name="description" content="A calm, free map of places to rest and recharge in Gothenburg. No ads, no tracking.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FEF2E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/ellenial-theme.js" data-light="#FEF2E2" data-dark="#17141F"></script>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <div id="home" class="home" hidden>
    <header id="home-top" class="wrap home__top"></header>
    <div id="stage" class="stage">
      <div id="map" class="map" role="region"></div>
      <section id="panel" class="sheet" data-snap="peek">
        <div id="panel-head" class="sheet__head"></div>
        <div id="panel-body" class="sheet__body"></div>
      </section>
    </div>
  </div>
  <div id="sheet-root"></div>
  <div id="page" class="wrap" hidden></div>
  <div id="status" class="wrap status" hidden></div>
  <p id="note" class="note" role="status" hidden></p>
  <noscript><p class="wrap">ellenial maps needs JavaScript to show the map and the places.</p></noscript>
</div>
<script src="/i18n.js"></script>
<script src="/map-style.js"></script>
<script src="/icons.js"></script>
<script src="/vendor/maplibre-gl-csp.js"></script>
<script src="/app.js"></script>
</body>
</html>
