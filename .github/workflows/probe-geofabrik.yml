name: Probe Geofabrik (temporary)
on:
  push:
    branches: [geofabrik-paths]
    paths: [.github/workflows/probe-geofabrik.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='ellenial-maps-data/2.0 (https://maps.ellenial.app)'
          echo "=== dated pbf files listed in the folder (2026)"
          curl -sSL -A "$UA" https://download.geofabrik.de/europe/sweden/ | grep -oE 'sweden-26[0-9]{4}\.osm\.pbf' | sort -u | tail -15
          echo "=== HEAD the last 10 days"
          for d in $(seq 0 10); do f=sweden-$(date -u -d "-$d day" +%y%m%d).osm.pbf
            echo "$f $(curl -sS -o /dev/null -I -A "$UA" -w '%{http_code} %{size_download} len=' https://download.geofabrik.de/europe/sweden/$f)$(curl -sSI -A "$UA" https://download.geofabrik.de/europe/sweden/$f | grep -i content-length | tr -d '\r')"; done
          echo "=== state.txt"; curl -sSL -A "$UA" https://download.geofabrik.de/europe/sweden/sweden-updates/state.txt || true
          curl -sSL -A "$UA" https://download.geofabrik.de/europe/sweden-updates/state.txt | head -5 || true
