# Rebuilds data/gothenburg.json every Monday night, so phones never ask OpenStreetMap or
# Wikimedia themselves. A push of the new file makes Vercel redeploy the site.
# If a week fails or looks wrong, nothing is committed and last week's file stays live.
name: Weekly data

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-data.mjs
      - data/dog-rules-goteborg.json
      - .github/workflows/weekly-data.yml

permissions:
  contents: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the data file
        id: build
        continue-on-error: true
        run: node scripts/build-data.mjs
      # The report is committed even when the week fails, so problems are visible in the repo.
      - name: Commit the data and the report if they changed
        if: always()
        run: |
          git config user.name "ellenial-maps weekly data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gothenburg.json data/report.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly data: $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Mark the run as failed if the data step failed
        if: steps.build.outcome == 'failure'
        run: exit 1
