# Rebuilds data/sweden/ (one small file per map square) every Monday night, so phones never ask OpenStreetMap or
# Wikimedia themselves. A push of the new file makes Vercel redeploy the site.
#
# The OpenStreetMap data comes from Geofabrik's daily Sweden file (one download, no busy
# public server to queue for). osmium keeps only the tags the app uses, for all of Sweden.
# If a week fails or looks wrong, the data file is not replaced and last week's stays live;
# data/report.json is committed either way, so what happened is visible in the repo.
name: Weekly data

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      allow_drop:
        description: 'Allow far fewer places than last week (only after a deliberate rule change)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scripts/build-data.mjs
      - scripts/fetch-photos.mjs
      - data/dog-rules-goteborg.json
      - .github/workflows/weekly-data.yml

permissions:
  contents: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

env:
  # Geofabrik moved every extract into its own folder on 2026-11-19 (the old flat
  # europe/sweden-latest.osm.pbf now redirects to a 404). Since then "latest" has sometimes pointed
  # at a dated file that isn't there yet, so the download step falls back to the newest dated file
  # (sweden-YYMMDD.osm.pbf) from the last 7 days that actually downloads.
  # Last resort when Geofabrik is down: OpenStreetMap France's daily Sweden extract (same OSM data).
  SOURCE_DIR: 'https://download.geofabrik.de/europe/sweden'
  BACKUP_URL: 'https://download.openstreetmap.fr/extracts/europe/sweden-latest.osm.pbf'

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Download Sweden from Geofabrik
        run: |
          mkdir -p work
          UA='ellenial-maps-data/2.0 (https://maps.ellenial.app)'
          get() { curl -fsSL --retry 3 --retry-delay 30 --retry-connrefused --connect-timeout 30 -A "$UA" -o work/sweden.osm.pbf "$1"; }
          if get "$SOURCE_DIR/sweden-latest.osm.pbf"; then
            echo "Downloaded sweden-latest"
          else
            ok=
            for d in 1 2 3 4 5 6 7; do
              f="sweden-$(date -u -d "-$d day" +%y%m%d).osm.pbf"
              echo "::warning::sweden-latest failed; trying $f"
              get "$SOURCE_DIR/$f" && { ok=$f; break; }
              [ $? -eq 7 ] && { echo "::warning::Geofabrik unreachable"; break; }
            done
            if [ -n "$ok" ]; then
              echo "::warning::Used $ok ($d days old) because Geofabrik's latest file was missing"
            elif get "$BACKUP_URL"; then
              echo "::warning::Geofabrik unreachable; used OpenStreetMap France's Sweden extract"
            else
              echo "::error::No Sweden file from Geofabrik (last 7 days) or OpenStreetMap France"; exit 1
            fi
          fi
          ls -lh work/sweden.osm.pbf
      - name: Keep only the tags we use
        run: |
          osmium tags-filter work/sweden.osm.pbf \
            nwr/leisure=park,nature_reserve,garden,bathing_place,swimming_area,dog_park \
            nwr/boundary=protected_area \
            nwr/tourism=viewpoint \
            nwr/viewpoint=yes \
            nwr/place=square \
            w/highway=pedestrian \
            nwr/natural=beach \
            nwr/amenity=library,toilets,drinking_water,shelter,bench \
            nwr/landuse=recreation_ground \
            -o work/filtered.osm.pbf
          osmium export work/filtered.osm.pbf -f geojsonseq -a type,id -o work/area.geojsonseq
          # Towns, villages and city areas, for search.
          osmium tags-filter work/sweden.osm.pbf n/place=city,town,village,suburb,quarter -o work/towns.osm.pbf
          osmium export work/towns.osm.pbf -f geojsonseq -a type,id -o work/towns.geojsonseq
          wc -l work/towns.geojsonseq
          wc -l work/area.geojsonseq
          ls -lh work/filtered.osm.pbf work/area.geojsonseq
      - name: Build the data file
        id: build
        continue-on-error: true
        run: node --max-old-space-size=6144 scripts/build-data.mjs --input work/area.geojsonseq --towns work/towns.geojsonseq ${{ inputs.allow_drop && '--allow-drop' || '' }}
      # Maps' own small copies of the photos, so the site never forwards requests to Wikimedia
      # (security re-check M1). A photo that can't be fetched keeps its old address until next week.
      # They're kept in the Cloudflare R2 bucket, not in the repo (23 Nov 2026: in the repo they rode
      # along in every Vercel deployment and filled its free 10 GB).
      - name: Copy and shrink the photos
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          npm i --no-save --no-audit --no-fund sharp@0.35 @aws-sdk/client-s3@3
          node scripts/fetch-photos.mjs
      - name: Commit the data and the report if they changed
        if: always()
        run: |
          git config user.name "ellenial-maps weekly data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/sweden data/photos.json data/photo-cache.json data/report.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly data: $(date -u +%F)"
            # Pushes to the branch the run started on (main every Monday; a test branch when run by hand).
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Mark the run as failed if the data step failed
        if: steps.build.outcome == 'failure'
        run: exit 1
