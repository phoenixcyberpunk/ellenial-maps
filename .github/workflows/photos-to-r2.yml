# One-off move (23 Nov 2026): copies the photos in data/photos/ to the Cloudflare R2 bucket, so they
# no longer have to ride along in every Vercel deployment (they filled the free 10 GB Deployment
# Storage). Runs on pushes to the photos-r2 branch only; delete this file once the move is merged.
name: Photos to R2 (one-off)

on:
  push:
    branches: [photos-r2]
    paths:
      - .github/workflows/photos-to-r2.yml

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      # The secret may hold just the account ID or the whole endpoint address; keep only the ID.
      - name: Work out the R2 address
        run: |
          id="${R2_ACCOUNT_ID#https://}"; id="${id%%.*}"
          echo "ENDPOINT=https://$id.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
      - name: Copy data/photos/ to R2
        run: |
          ls data/photos | wc -l
          aws s3 sync data/photos s3://ellenial-maps-photos/ --endpoint-url "$ENDPOINT" \
            --size-only --only-show-errors \
            --content-type image/jpeg --cache-control 'public, max-age=31536000, immutable'
      - name: Check every photo arrived
        run: |
          local=$(ls data/photos | grep -c '\.jpg$')
          remote=$(aws s3 ls s3://ellenial-maps-photos/ --endpoint-url "$ENDPOINT" | grep -c '\.jpg$')
          echo "local $local, in R2 $remote"
          [ "$remote" -ge "$local" ]
